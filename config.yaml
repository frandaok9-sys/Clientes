# Firma de los borradores
oferta:
  remitente: "[tu nombre]"   # (sin definir) completar antes de enviar
  cta: "¿Te muestro una demo con tus propios datos? Son 20 minutos."
  baja: "Si no te interesa, respondé BAJA y no te escribimos más."

# Qué dato concreto se menciona en el borrador A según la señal detectada
hechos:
  proyectos_campo: hace obras y proyectos para terceros
  usd_mineria_energia: trabaja para minería o energía
  crecimiento: está sumando gente
  vendedores: tiene equipo comercial en la calle

# Bajas permanentes (Ley 25.326): nunca se borra, se agrega
