# Reglas de calificación para COI.
# Fuente: contexto/prospeccion-masiva-contexto.md (secciones 3, 4 y 5). Si cambia el brief, cambiá esto.

pais_por_defecto: AR

# Alias de columnas de las listas de entrada (se ignoran mayúsculas, acentos y espacios)
columnas:
  razon_social: [razon_social, empresa, company, compania, cliente, nombre_empresa]
  nombre_fantasia: [nombre_fantasia, fantasia, marca, nombre_comercial]
  cuit: [cuit, cuil, cuit_empresa, tax_id]
  rubro: [rubro, sector, actividad, industria, industry, categoria]
  localidad: [localidad, ciudad, city, partido]
  provincia: [provincia, estado, region]
  pais: [pais, country]
  web: [web, website, sitio_web, url, pagina, dominio]
  empleados: [empleados, empleados_aprox, trabajadores, employees, dotacion, tamano]
  contacto_nombre: [contacto_nombre, contacto, nombre, nombre_contacto, name]
  contacto_cargo: [contacto_cargo, cargo, puesto, position, title]
  email: [email, contacto_email, correo, mail, e_mail]
  email_estado: [email_estado, estado_email]
  telefono: [telefono, contacto_telefono, phone, tel, movil, celular, whatsapp]
  senales: [senales, señales, observaciones, notas, comentarios, descripcion, notes]
  fuente: [fuente, origen, source]

# Rubros prioritarios (brief, sección 3). Se detectan por palabras en rubro, razón social,
# nombre de fantasía, web y señales. El primero que coincide gana.
rubros:
  - nombre: Montajes industriales y estructuras metálicas
    frase: hace montajes y estructuras metálicas
    palabras: [montaje, montajes, estructuras metalicas, estructura metalica, naves industriales, galpones]
    dolor: el costo real de cada proyecto suele aparecer recién al cerrarlo
    solucion: junta presupuestos, gastos por proyecto y cobranzas en pesos y dólares, y te muestra el margen mientras el proyecto avanza
    plan: Industrial
  - nombre: Metalúrgicas / metalmecánica a pedido
    frase: trabaja en metalurgia a pedido
    palabras: [metalurgica, metalurgicas, metalurgia, metalmecanica, torneria, caldereria, fabricacion a medida, mecanizado, mecanizados, herreria industrial, matriceria, matriceria, fundicion, soldadura, talleres industriales, talleres metalurgicos, galvanizado, metal, metales, metalica, metalicas, fabricacion de maquinaria, fabricacion de maquinas, fabricacion y reparacion, maquinas y equipos, equipos industriales, engranajes, acoplados, polipastos, mecanizado semipesado, fundicion de]
    dolor: cada presupuesto a medida se arma distinto y el margen real por trabajo no se ve
    solucion: arma los presupuestos por costo más ganancia y te muestra cuánto dejó cada trabajo
    plan: Emprendedor / Industrial
  - nombre: Minería y energía (proveedores y contratistas)
    frase: trabaja para minería y energía
    palabras: [mineria, minera, minero, petrolera, petroleo, oil, gas y petroleo, renovables, energia, electrica, eolico, solar, litio, vaca muerta]
    dolor: entre el trabajo en campo, la facturación en dólares y las certificaciones se pierde el control del proyecto
    solucion: lleva la cuenta corriente en pesos y dólares por separado y factura por anticipo y certificación de avance
    plan: Industrial
  - nombre: Instalaciones (eléctricas, termomecánicas, gas, incendio)
    frase: hace instalaciones industriales
    palabras: [instalaciones, instalacion electrica, termomecanica, termomecanicas, gas, incendio, climatizacion, sanitarias]
    dolor: las oportunidades y los gastos de cada obra quedan repartidos entre planillas y WhatsApp
    solucion: sigue cada oportunidad hasta el cierre e imputa los gastos a cada obra
    plan: Industrial
  - nombre: Servicios técnicos y mantenimiento industrial
    frase: da servicios técnicos y de mantenimiento industrial
    palabras: [mantenimiento industrial, mantenimiento, service, servicio tecnico, servicios tecnicos, reparacion industrial, servicios industriales, automatizacion, talleres]
    dolor: coordinar visitas y saber qué tiene cada técnico o vendedor en su cartera cuesta más de lo que debería
    solucion: arma las hojas de ruta con mapa y le da a cada uno su cartera y sus tareas, también desde el celular
    plan: Industrial
  - nombre: Agroindustria (proveedores de servicios/insumos)
    frase: trabaja con el agro
    palabras: [agroindustria, agroindustrial, agroindustriales, empaque, frio, frigorifico, riego, maquinaria agricola, agroinsumos, agro insumos, insumos agropecuarios, agroservicios, agro servicios, silos, acopio, semillas, fertilizantes]
    dolor: con ventas en el campo y cobranzas con cheques, cuesta saber qué se vendió y qué se cobró
    solucion: junta ventas, cuentas corrientes y control de cheques en un solo lugar
    plan: Emprendedor / Industrial
  - nombre: Pisos y revestimientos industriales
    frase: hace pisos y revestimientos industriales
    palabras: [pisos industriales, piso industrial, revestimientos, recubrimientos, impermeabilizacion, epoxi, hormigon alisado]
    dolor: cotizar cada proyecto y cobrar anticipo más avance se vuelve un lío de planillas
    solucion: cotiza por proyecto y factura por anticipo y certificación de avance
    plan: Industrial
  - nombre: Distribuidoras de insumos industriales
    frase: distribuye insumos industriales
    palabras: [distribuidora, distribuidor, representante, representaciones, insumos industriales, suministros industriales, ferreteria industrial, rodamientos, transmisiones, bulonera, hidraulica, neumatica, electromecanica, suministros]
    dolor: con un catálogo técnico grande, el seguimiento de cada cotización y la cuenta corriente por moneda se desordenan
    solucion: une pipeline, catálogo de productos y cuenta corriente en pesos y dólares
    plan: Emprendedor

# Rubros informados que NO son industriales aunque el nombre lo sugiera (anulan la detección por nombre)
rubro_no_objetivo: [libreria, papeleria, muebles de oficina, no insumos industriales, no es industria, inmobiliaria, seguros, estudio contable, consultora de recursos humanos]

# Si no cae en un rubro prioritario pero es industrial B2B
industrial_generico:
  frase: es una empresa industrial
  palabras: [industrial, industriales, industria, industrias, ind, s.a.i.c, saic, s.a.i.c.i, s.a.i.c.f, fabrica, planta, manufactura, ingenieria, ing, obras, construccion, construcciones, constructora, autopartes, plasticos, quimica, maquinaria, maquinas, tecnica, tecno]
  dolor: la información de ventas y administración queda repartida entre planillas, mails y WhatsApp
  solucion: pone ventas, administración y números de la dirección en un solo sistema
  plan: Emprendedor

# Puntaje (brief, sección 5)
puntaje:
  rubro_prioritario: 3
  rubro_industrial_no_listado: 1
  tamano_en_rango: 2          # 10–100 empleados
  tamano_min: 10
  tamano_max: 100
  vendedores: 2
  proyectos_campo: 2
  usd_mineria_energia: 1
  crecimiento: 1
  google_workspace: 1
  contacto_decision: 1

senales:
  vendedores: [vendedores, vendedor, comercial, comerciales, area comercial, ejecutivo de cuentas, representantes, fuerza de ventas]
  proyectos_campo: [proyectos, obras, obra, en campo, montaje, instalacion, servicio en planta, mantenimiento, certificaciones]
  usd_mineria_energia: [exportacion, exporta, exportadora, usd, dolares, dolar, u$s, mineria, minera, energia, petrolera, oil, renovables, litio]
  crecimiento: [busqueda laboral, buscamos, estamos buscando, sucursal nueva, nueva sucursal, nueva planta, expansion, creciendo, contratando]
  cargos_decision: [dueno, dueña, dueño, socio, propietario, presidente, director, gerente general, gerente comercial, gerente administrativo, gerente de administracion, ceo, gerente]

categorias:
  A: 10   # >= 10
  B: 6    # 6–9 ; <= 5 -> C

