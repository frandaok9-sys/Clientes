  empleados_grande: 250
  competidores: [software de gestion, erp, crm, sistemas de gestion, desarrollo de software]
  clientes_actuales: [RC Pisos Industriales, Apex Noa Soluciones Integrales]
  unipersonal: [unipersonal, monotributista, independiente, freelance]

# Proveedores de correo gratuito: sin dominio propio -> requiere_dominio = sí
